name: repair_shop_app
description: App quản lý cửa hàng sửa chữa điện thoại (Android + Windows)
publish_to: 'none'
version: 2.1.6+20106

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Supabase (auth + database realtime)
  supabase_flutter: ^2.5.6
  realtime_client: ^2.5.0
  postgrest: ^2.8.0

  # Firebase (push notification)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  google_sign_in: ^6.2.1
  win32_registry: ^1.1.5
  win32: ^5.5.0
  ffi: ^2.1.0

  # Printing & Bluetooth
  flutter_blue_plus: ^1.35.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.5.5
  printing: ^5.12.0

  # UI / tiện ích
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  fl_chart: ^0.68.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  image: ^4.2.0
  uuid: ^4.4.0
  http: ^1.6.0
  path_provider: ^2.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/
